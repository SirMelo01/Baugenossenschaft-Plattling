version: '3'

volumes:
  baugenossenschaft_plattling_production_postgres_data: {}
  baugenossenschaft_plattling_production_postgres_data_backups: {}
  baugenossenschaft_plattling_production_traefik: {}
  baugenossenschaft_plattling_production_django_media: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: baugenossenschaft_plattling_production_django
    container_name: baugenossenschaft_plattling_production_django
    volumes:
      - baugenossenschaft_plattling_production_django_media:/app/yoolink/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: baugenossenschaft_plattling_production_postgres
    container_name: baugenossenschaft_plattling_production_postgres
    volumes:
      - baugenossenschaft_plattling_production_postgres_data:/var/lib/postgresql/data
      - baugenossenschaft_plattling_production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: baugenossenschaft_plattling_production_traefik
    container_name: baugenossenschaft_plattling_production_traefik
    depends_on:
      - django
    volumes:
      - baugenossenschaft_plattling_production_traefik:/etc/traefik/acme
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:5555:5555"

  redis:
    image: redis:6
    container_name: baugenossenschaft_plattling_production_redis

  celeryworker:
    <<: *django
    image: baugenossenschaft_plattling_production_celeryworker
    container_name: baugenossenschaft_plattling_production_celeryworker
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: baugenossenschaft_plattling_production_celerybeat
    container_name: baugenossenschaft_plattling_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: baugenossenschaft_plattling_production_flower
    container_name: baugenossenschaft_plattling_production_flower
    command: /start-flower
  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: baugenossenschaft_plattling_production_nginx
    container_name: baugenossenschaft_plattling_production_nginx
    depends_on:
      - django
    volumes:
      - baugenossenschaft_plattling_production_django_media:/usr/share/nginx/media:ro

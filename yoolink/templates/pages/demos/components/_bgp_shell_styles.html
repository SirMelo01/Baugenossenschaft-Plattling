{% load static %}
<link rel="stylesheet" href="{% static 'css/aos.css' %}" />
<style>
  .bgp-bg-navy { background-color: #4B6671; }
  .bgp-bg-navy-dark { background-color: #3A505A; }
  .bgp-bg-navy-deep { background-color: #2E434C; }
  .bgp-bg-ice { background-color: #EEF5F8; }
  .bgp-bg-ice-deep { background-color: #E3F0F4; }
  .bgp-bg-yellow { background-color: #FFDC16; }
  .bgp-text-navy { color: #4B6671; }
  .bgp-text-navy-dark { color: #2E434C; }
  .bgp-text-yellow { color: #FFDC16; }
  .bgp-text-ice { color: #DCE9EF; }
  .bgp-border-navy { border-color: #4B6671; }
  .bgp-border-yellow { border-color: #FFDC16; }
  .bgp-ring-ice { --tw-ring-color: #C9DEE6; }

  .hyphenate {
    -webkit-hyphens: auto;
    hyphens: auto;
    overflow-wrap: break-word;
  }

  .bgp-btn-yellow {
    background-color: #FFDC16;
    color: #2E434C;
  }
  .bgp-btn-yellow:hover { background-color: #F2CE00; }

  .bgp-btn-navy {
    background-color: #4B6671;
    color: #ffffff;
  }
  .bgp-btn-navy:hover { background-color: #3A505A; }

  .bgp-hero {
    background: linear-gradient(160deg, #2E434C 0%, #4B6671 55%, #5C7A87 100%);
  }
  .bgp-hero-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.12;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.45) 1px, transparent 0);
    background-size: 26px 26px;
    pointer-events: none;
  }

  .bgp-accent-bar {
    height: 5px;
    background: linear-gradient(90deg, rgba(255,220,22,0.35) 0%, #FFDC16 50%, rgba(255,220,22,0.35) 100%);
  }

  .bgp-vacation-banner {
    border-bottom: 1px solid rgba(46,67,76,.14);
    background-color: #FFDC16;
    color: #2E434C;
    font-size: .875rem;
    font-weight: 600;
    line-height: 1.45;
  }
  .bgp-vacation-banner-inner {
    display: flex;
    min-height: 2.5rem;
    max-width: 80rem;
    align-items: center;
    justify-content: center;
    gap: .625rem;
    margin: 0 auto;
    padding: .5rem 1rem;
    text-align: center;
  }
  .bgp-vacation-banner-icon {
    flex: 0 0 auto;
    font-size: 1rem;
  }
  .bgp-vacation-banner-text {
    min-width: 0;
  }
  @media (min-width: 640px) {
    .bgp-vacation-banner-inner {
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }
  }

  .bgp-card-hover { transition: transform .3s ease, box-shadow .3s ease; }
  .bgp-card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -18px rgba(46,67,76,0.35); }

  .bgp-nav {
    align-items: center;
    gap: .125rem;
  }
  .bgp-nav-item { position: relative; }

  .bgp-nav-trigger {
    display: inline-flex;
    align-items: center;
    gap: .375rem;
    border-radius: .625rem;
    padding: .5rem .75rem;
    font-size: .875rem;
    font-weight: 500;
    white-space: nowrap;
    color: #DCE9EF;
    background-color: transparent;
    transition: color .2s ease, background-color .2s ease;
  }
  .bgp-nav-trigger:hover,
  .bgp-nav-trigger.is-active,
  .bgp-nav-item.is-open > .bgp-nav-trigger {
    color: #FFDC16;
    background-color: rgba(255,255,255,.08);
  }
  .bgp-nav-caret {
    font-size: .625rem;
    opacity: .7;
    transition: transform .2s ease;
  }
  .bgp-nav-item.is-open .bgp-nav-caret { transform: rotate(180deg); }

  .bgp-nav-divider {
    width: 1px;
    height: 1.5rem;
    margin: 0 .625rem;
    background-color: rgba(255,255,255,.16);
  }

  .bgp-nav-phone {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    border-radius: .625rem;
    padding: .625rem .875rem;
    font-size: .875rem;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 1px 2px 0 rgba(0,0,0,.05);
    transition: background-color .2s ease;
  }
  .bgp-nav-phone-label { display: none; }
  @media (min-width: 1180px) {
    .bgp-nav-phone-label { display: inline; }
  }

  .bgp-nav-panel {
    position: absolute;
    top: calc(100% + .75rem);
    left: 0;
    z-index: 60;
    width: 21.5rem;
    padding: .5rem;
    border: 1px solid #E3F0F4;
    border-radius: 1rem;
    background-color: #ffffff;
    box-shadow: 0 24px 48px -20px rgba(46,67,76,.5);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-.5rem);
    transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
  }
  .bgp-nav-panel::before {
    content: "";
    position: absolute;
    top: -.75rem;
    left: 0;
    right: 0;
    height: .75rem;
  }
  .bgp-nav-item.is-open > .bgp-nav-panel {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .bgp-nav-panel-link {
    display: flex;
    align-items: flex-start;
    gap: .75rem;
    border-radius: .75rem;
    padding: .625rem .75rem;
    transition: background-color .18s ease;
  }
  .bgp-nav-panel-link:hover { background-color: #EEF5F8; }
  .bgp-nav-panel-icon {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: .625rem;
    background-color: #E3F0F4;
    color: #4B6671;
    font-size: 1rem;
    transition: background-color .18s ease, color .18s ease;
  }
  .bgp-nav-panel-link:hover .bgp-nav-panel-icon,
  .bgp-nav-panel-link.is-active .bgp-nav-panel-icon {
    background-color: #FFDC16;
    color: #2E434C;
  }
  .bgp-nav-panel-title {
    display: block;
    font-size: .875rem;
    font-weight: 700;
    line-height: 1.35;
    color: #2E434C;
  }
  .bgp-nav-panel-desc {
    display: block;
    margin-top: .125rem;
    font-size: .75rem;
    line-height: 1.45;
    color: #6b7280;
  }

  .bgp-mobile-menu {
    display: none;
    max-height: calc(100vh - 5rem);
    overflow-y: auto;
    border-top: 1px solid rgba(255,255,255,.1);
    padding: .5rem 1rem 1.25rem;
  }
  .bgp-mobile-menu.is-open { display: block; }
  @media (min-width: 976px) {
    .bgp-mobile-menu,
    .bgp-mobile-menu.is-open { display: none; }
  }

  .bgp-mobile-link {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    border-radius: .75rem;
    padding: .875rem .75rem;
    text-align: left;
    font-size: 1rem;
    font-weight: 600;
    color: #DCE9EF;
    transition: color .2s ease, background-color .2s ease;
  }
  .bgp-mobile-link:hover,
  .bgp-mobile-link.is-active { color: #FFDC16; }
  .bgp-mobile-caret {
    flex: 0 0 auto;
    font-size: .75rem;
    opacity: .7;
    transition: transform .25s ease;
  }
  .bgp-mobile-group.is-open .bgp-mobile-link { color: #FFDC16; }
  .bgp-mobile-group.is-open .bgp-mobile-caret { transform: rotate(180deg); }

  .bgp-mobile-sub {
    display: none;
    margin: 0 0 .5rem .75rem;
    padding-left: .75rem;
    border-left: 2px solid rgba(255,220,22,.4);
  }
  .bgp-mobile-group.is-open .bgp-mobile-sub { display: block; }
  .bgp-mobile-sub-link {
    display: flex;
    align-items: center;
    gap: .625rem;
    border-radius: .625rem;
    padding: .625rem .75rem;
    font-size: .9375rem;
    color: rgba(220,233,239,.75);
    transition: color .2s ease, background-color .2s ease;
  }
  .bgp-mobile-sub-link:hover,
  .bgp-mobile-sub-link.is-active {
    color: #FFDC16;
    background-color: rgba(255,255,255,.06);
  }

  .bgp-mobile-phone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    margin-top: .75rem;
    border-radius: .75rem;
    padding: .875rem 1rem;
    font-size: .9375rem;
    font-weight: 700;
  }

  @media (prefers-reduced-motion: reduce) {
    .bgp-nav-panel,
    .bgp-nav-caret,
    .bgp-mobile-caret { transition: none; }
  }

  .bgp-focus:focus-visible {
    outline: 3px solid #FFDC16;
    outline-offset: 2px;
  }

  .bgp-toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    z-index: 80;
    display: flex;
    align-items: center;
    gap: .625rem;
    border-radius: .875rem;
    background-color: #2E434C;
    padding: .875rem 1.25rem;
    font-size: .875rem;
    font-weight: 600;
    color: #ffffff;
    box-shadow: 0 20px 45px -15px rgba(0,0,0,.5);
    transform: translate(-50%, 1.5rem);
    opacity: 0;
    pointer-events: none;
    transition: transform .28s ease, opacity .28s ease;
  }
  .bgp-toast.is-visible {
    transform: translate(-50%, 0);
    opacity: 1;
  }

  .bgp-modal {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 1rem;
    background-color: rgba(46,67,76,.72);
    backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
  }
  .bgp-modal.is-open { opacity: 1; visibility: visible; }
  .bgp-modal-panel {
    position: relative;
    width: 100%;
    max-width: 42rem;
    margin: auto;
    overflow: hidden;
    border-radius: 1.25rem;
    background-color: #ffffff;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.45);
    transform: translateY(14px) scale(.98);
    transition: transform .25s ease;
  }
  .bgp-modal.is-open .bgp-modal-panel { transform: translateY(0) scale(1); }

  .bgp-prose p { margin-bottom: 1rem; line-height: 1.75; color: #4b5563; }
  .bgp-prose p:last-child { margin-bottom: 0; }
  .bgp-prose ul { margin-bottom: 1rem; padding-left: 1.25rem; list-style: disc; color: #4b5563; }
  .bgp-prose li { margin-bottom: .375rem; line-height: 1.7; }
  .bgp-prose strong { color: #111827; }
</style>

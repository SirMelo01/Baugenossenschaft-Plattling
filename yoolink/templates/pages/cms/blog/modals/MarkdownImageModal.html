<div class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-950/70 p-2 backdrop-blur-sm sm:p-4"
    id="markdownImageModal" role="dialog" aria-modal="true" aria-labelledby="markdownImageTitle">
    <div class="modal-container markdown-image-modal-container media-picker-container flex h-[calc(100dvh-1rem)] w-full max-w-6xl flex-col overflow-hidden rounded-lg bg-white shadow-2xl ring-1 ring-slate-200 sm:h-auto sm:max-h-[90vh]">
        <div class="flex flex-shrink-0 items-start justify-between border-b border-slate-200 px-4 py-4 sm:px-6 sm:py-5">
            <div>
                <p class="text-xs font-semibold uppercase tracking-wide text-blue-700">Markdown</p>
                <h3 class="mt-1 text-2xl font-semibold text-slate-950" id="markdownImageTitle">Bild einfügen</h3>
            </div>
            <button type="button" id="closeMarkdownImageModal"
                class="rounded-md p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-900">
                <svg aria-hidden="true" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd"></path>
                </svg>
                <span class="sr-only">Schließen</span>
            </button>
        </div>

        <div class="media-picker-body grid min-h-0 flex-1 grid-cols-1 overflow-y-auto lg:grid-cols-[20rem_minmax(0,1fr)] lg:overflow-hidden">
            <aside class="media-picker-sidebar border-b border-slate-200 bg-slate-50 p-3 sm:p-4 lg:overflow-y-auto lg:border-b-0 lg:border-r">
                <div class="grid grid-cols-2 gap-2 lg:grid-cols-1" role="tablist" aria-label="Bildquelle">
                    <button type="button" id="markdownImageLibraryTab" role="tab" aria-selected="true"
                        aria-controls="markdownImageLibraryPanel"
                        class="markdown-image-tab media-picker-tab is-active rounded-md px-4 py-3 text-left text-sm font-semibold"
                        data-target="markdownImageLibraryPanel">
                        <span class="block">Mediathek</span>
                        <span class="mt-1 block text-xs font-normal opacity-80">Vorhandenes Bild</span>
                    </button>
                    <button type="button" id="markdownImageUploadTab" role="tab" aria-selected="false"
                        aria-controls="markdownImageUploadPanel"
                        class="markdown-image-tab media-picker-tab rounded-md px-4 py-3 text-left text-sm font-semibold"
                        data-target="markdownImageUploadPanel">
                        <span class="block">Upload</span>
                        <span class="mt-1 block text-xs font-normal opacity-80">Neue Datei</span>
                    </button>
                </div>

                <div class="mt-6 rounded-lg border border-slate-200 bg-white p-4">
                    <p class="text-sm font-semibold text-slate-900">Auswahl</p>
                    <div class="mt-3 aspect-video overflow-hidden rounded-md bg-slate-100">
                        <img id="markdownImageSelectedPreview" src="" alt="Ausgewähltes Bild"
                            class="hidden h-full w-full object-cover" />
                        <div id="markdownImageSelectedPlaceholder"
                            class="flex h-full items-center justify-center px-4 text-center text-sm text-slate-400">
                            Kein Bild ausgewählt
                        </div>
                    </div>
                </div>

                <div class="mt-4 space-y-3 rounded-lg border border-slate-200 bg-white p-4">
                    <label class="block text-sm font-semibold text-slate-900" for="markdownImageAlt">Alt-Text</label>
                    <input id="markdownImageAlt" type="text"
                        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                        placeholder="Beschreibender Bildtext">

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500" for="markdownImageWidth">Breite</label>
                            <input id="markdownImageWidth" type="text"
                                class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                                placeholder="100%">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500" for="markdownImageHeight">Höhe</label>
                            <input id="markdownImageHeight" type="text"
                                class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                                placeholder="auto">
                        </div>
                    </div>
                </div>
            </aside>

            <div class="media-picker-main flex min-h-0 flex-col p-4 sm:p-6">
                <section id="markdownImageLibraryPanel" role="tabpanel" aria-labelledby="markdownImageLibraryTab"
                    class="markdown-image-panel media-picker-panel flex min-h-0 flex-1 flex-col">
                    <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                        <h4 class="text-lg font-semibold text-slate-950">Mediathek</h4>
                        <div class="flex gap-2">
                            <label class="sr-only" for="markdownImageSearchInput">Bilder suchen</label>
                            <input id="markdownImageSearchInput" type="search" placeholder="Bilder suchen" autocomplete="off"
                                class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100 sm:w-56">
                            <button id="reloadMarkdownImages" type="button" title="Mediathek neu laden"
                                class="flex-shrink-0 rounded-md bg-slate-900 px-3 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">
                                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                                <span class="sr-only">Neu laden</span>
                            </button>
                        </div>
                    </div>

                    <div class="media-grid-wrap relative min-h-0 flex-1 overflow-auto rounded-lg border border-slate-200 bg-slate-50 p-3"
                        data-media-grid-wrap>
                        <div class="media-grid" id="markdownImageLibrary" role="listbox" aria-label="Bilder der Mediathek"></div>
                        <div id="markdownImageEmpty" class="hidden py-16 text-center">
                            <p class="text-base font-semibold text-slate-700">Keine Bilder gefunden</p>
                        </div>
                        <div class="media-grid-spinner" aria-hidden="true"><span class="media-spinner"></span></div>
                    </div>
                    <div class="mt-3 flex items-center justify-between gap-3">
                        <button id="markdownImagePrevPage" type="button"
                            class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-white disabled:cursor-not-allowed disabled:opacity-40">
                            Zurück
                        </button>
                        <span id="markdownImagePageInfo" class="text-sm font-semibold text-slate-500">Seite 1 / 1</span>
                        <button id="markdownImageNextPage" type="button"
                            class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-white disabled:cursor-not-allowed disabled:opacity-40">
                            Weiter
                        </button>
                    </div>
                </section>

                <section id="markdownImageUploadPanel" role="tabpanel" aria-labelledby="markdownImageUploadTab"
                    class="markdown-image-panel media-picker-panel hidden min-h-0 flex-1 flex-col">
                    <h4 class="mb-4 text-lg font-semibold text-slate-950">Upload</h4>
                    <div id="markdownImageUploadDropzone"
                        class="flex min-h-[18rem] flex-1 cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed border-blue-200 bg-blue-50/60 px-6 py-10 text-center transition hover:border-blue-400 hover:bg-blue-50">
                        <div class="flex h-14 w-14 items-center justify-center rounded-full bg-white text-blue-700 shadow-sm">
                            <i class="bi bi-cloud-arrow-up text-3xl"></i>
                        </div>
                        <p class="mt-5 text-lg font-semibold text-slate-950">Bilddatei auswählen</p>
                        <p id="markdownImageSelectedFileName" class="mt-2 text-sm text-slate-500">JPG, PNG, GIF oder WebP</p>
                        <input id="markdownImageFile" class="hidden" type="file" accept="image/jpg,image/png,image/jpeg,image/gif,image/webp,image/*">
                    </div>
                    <label class="mt-3 inline-flex items-center gap-2 text-xs text-slate-500">
                        <input id="markdownImageSkipOptimization" type="checkbox" class="h-3.5 w-3.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        Ohne Komprimierung hochladen
                    </label>
                    <div id="markdownImageUploadQueue" class="mt-4 hidden max-h-56 overflow-auto rounded-lg border border-slate-200 bg-white p-3">
                        <p class="mb-2 text-sm font-semibold text-slate-900">Upload-Verlauf</p>
                        <div id="markdownImageUploadItems" class="space-y-2"></div>
                    </div>
                </section>
            </div>
        </div>

        <div class="flex flex-shrink-0 flex-col gap-3 border-t border-slate-200 bg-white px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6 sm:py-4">
            <button type="button" id="cancelMarkdownImage"
                class="inline-flex items-center justify-center rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 hover:text-slate-950">
                Abbrechen
            </button>
            <p class="text-sm text-slate-500">
                <kbd class="rounded border border-slate-300 px-1.5 py-0.5 text-xs">Esc</kbd> schließt,
                <kbd class="rounded border border-slate-300 px-1.5 py-0.5 text-xs">Enter</kbd> fügt das markierte Bild ein.
            </p>
            <button type="button" id="insertMarkdownImage"
                class="inline-flex items-center justify-center rounded-md bg-blue-700 px-5 py-2 text-sm font-semibold text-white transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50">
                Einfügen
            </button>
        </div>
    </div>
</div>

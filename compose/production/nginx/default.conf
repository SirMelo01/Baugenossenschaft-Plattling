server {

	server_name  bgsplattling.yoolink.de;

	# Pfad ist der Mountpoint des Media-Volumes IM Container (siehe production.yml:
	# baugenossenschaft_plattling_production_django_media:/usr/share/nginx/media),
	# nicht der Host-Pfad des Docker-Volumes.
	location /media/ {
		alias /usr/share/nginx/media/;
	}

	listen       80;
}
